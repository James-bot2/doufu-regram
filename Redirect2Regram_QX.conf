# Redirect2Regram for Quantumult X
# TG 外链接跳转 Regram（Quantumult X 原生版，无需解析器）
# 参考 Surge 模块：Redirect2Ng by ddgksf2013，https://ddgksf2013.top/module/Redirect2Ng.sgmodule
# 目标客户端：Regram，https://github.com/RegramDev/Regram-ios
# 原理：拦截 https://t.me/... 链接，307 跳转到 regram:// 深链接，强制用 Regram 打开
# Scheme 依据：Regram 构建配置 app_specific_url_scheme 为 regram，应用注册了 regram 与 rg 两个专属 scheme，与 tg 兼容处理
# 说明：原 Surge 版只有一条规则 t.me/(.+) -> tg://resolve?domain=$1，频道帖子、私密邀请、Bot start 参数等都会跳错，且 tg 会被官方版等客户端抢走
# 本 QX 版拆成多条有序规则分别处理，普通用户名链接行为与原版一致，只是 scheme 换成 regram
# 用法一（远程重写）：把本文件放到可直链访问的位置后，在配置 [rewrite_remote] 里引用本文件地址
# 用法二（本地重写）：把下方 hostname 行合并进配置 [mitm] 的 hostname，把所有 url 307 规则行粘贴到 [rewrite_local] 下
# 前提：Quantumult X 已开启重写与 MitM，并已安装信任证书；手机已安装 Regram
# 注意：QX 不支持在规则行尾写注释，本文件注释均为独立行，不要把注释挪到规则行尾

hostname = t.me, *.t.me

# 私密频道帖子 t.me/c/频道ID/帖子ID
^https?:\/\/t\.me\/c\/([0-9]+)\/([0-9]+) url 307 regram://privatepost?channel=$1&post=$2
# 私密邀请链接 t.me/+邀请码
^https?:\/\/t\.me\/\+([A-Za-z0-9_-]+) url 307 regram://join?invite=$1
# 旧版私密邀请链接 t.me/joinchat/邀请码
^https?:\/\/t\.me\/joinchat\/([A-Za-z0-9_-]+) url 307 regram://join?invite=$1
# MTProxy 链接 t.me/proxy?...
^https?:\/\/t\.me\/proxy\?(.*) url 307 regram://proxy?$1
# SOCKS5 链接 t.me/socks?...
^https?:\/\/t\.me\/socks\?(.*) url 307 regram://socks?$1
# 分享链接 t.me/share/url?...
^https?:\/\/t\.me\/share\/url\?(.*) url 307 regram://msg_url?$1
# 即时预览链接 t.me/iv?...
^https?:\/\/t\.me\/iv\?(.*) url 307 regram://iv?$1
# 贴纸包 t.me/addstickers/名称
^https?:\/\/t\.me\/addstickers\/([A-Za-z0-9_]+) url 307 regram://addstickers?set=$1
# 表情包 t.me/addemoji/名称
^https?:\/\/t\.me\/addemoji\/([A-Za-z0-9_]+) url 307 regram://addemoji?set=$1
# 文件夹分享 t.me/addlist/标识
^https?:\/\/t\.me\/addlist\/([A-Za-z0-9_-]+) url 307 regram://addlist?slug=$1
# 语言包 t.me/setlanguage/语言
^https?:\/\/t\.me\/setlanguage\/([A-Za-z0-9_-]+) url 307 regram://setlanguage?lang=$1
# 频道助力 t.me/boost/用户名
^https?:\/\/t\.me\/boost\/([A-Za-z0-9_]+) url 307 regram://boost?domain=$1
# 网页预览帖子 t.me/s/频道/帖子ID
^https?:\/\/t\.me\/s\/([A-Za-z0-9_]+)\/([0-9]+) url 307 regram://resolve?domain=$1&post=$2
# 网页预览频道 t.me/s/频道
^https?:\/\/t\.me\/s\/([A-Za-z0-9_]+) url 307 regram://resolve?domain=$1
# 频道帖子带参数 t.me/频道/帖子ID?single 等
^https?:\/\/t\.me\/([A-Za-z0-9_]+)\/([0-9]+)\?(.*) url 307 regram://resolve?domain=$1&post=$2&$3
# 频道帖子 t.me/频道/帖子ID
^https?:\/\/t\.me\/([A-Za-z0-9_]+)\/([0-9]+) url 307 regram://resolve?domain=$1&post=$2
# 带参数链接 t.me/用户名?start=... 等，含 Bot start、预填文本、profile
^https?:\/\/t\.me\/([A-Za-z0-9_]+)\?(.*) url 307 regram://resolve?domain=$1&$2
# 普通链接 t.me/用户名
^https?:\/\/t\.me\/([A-Za-z0-9_]+) url 307 regram://resolve?domain=$1
# 子域名链接 用户名.t.me
^https?:\/\/([A-Za-z0-9_]+)\.t\.me\/? url 307 regram://resolve?domain=$1

# 备用：短 scheme 版，把上方所有 regram 换成 rg 即可，Regram 同时注册了 rg
# 备用：通用 tg 版，把上方所有 regram 换成 tg 即可，会由手机上接管 tg 的客户端打开，不保证是 Regram
# 忠实原版单条规则（备用，与上方多条规则二选一，不要同时启用）
# ^https?:\/\/t\.me\/(.+) url 307 regram://resolve?domain=$1
